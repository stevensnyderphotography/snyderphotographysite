<head>

  <link rel="stylesheet" href="css/style.css?v=48">
  <style>
    .splash-nav {
      position: relative;
      z-index: 3;
      padding: 22px 40px 0;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
    }
    .splash-nav a {
      font-size: 1.0rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.9);
      text-decoration: none;
      padding: 8px 16px;
      display: inline-flex;
      align-items: center;
      transition: color 0.2s;
    }
    .splash-nav a:hover { color: #fff; }
    .splash-nav a.splash-cta:hover { color: #111; }
    .splash-nav-dot {
      color: rgba(255,255,255,0.4);
      font-size: 1.0rem;
      padding: 0 4px;
    }
    .topic-header {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 4;
      display: flex;
      align-items: center;
      padding: 0 40px 0 28px;
      gap: 24px;
    }
    .topic-header-logo {
      flex: 0 0 auto;
      line-height: 0;
    }
    .topic-header-logo img {
      height: 192px;
      display: block;
    }
    .topic-header .splash-nav {
      flex: 1;
      padding: 0;
    }
    @media (max-width: 600px) {
      .splash-nav { flex-direction: column; gap: 4px; }
      .splash-nav-dot { display: none; }
      .splash-logo-wrap { transform: none !important; }
      .splash-logo { width: min(90vw, 360px) !important; }
      .topic-header {
        position: static;
        flex-direction: column;
        align-items: flex-start;
        gap: 12px;
        padding: 16px;
      }
      .topic-header-logo img { height: 80px; }
      .cat-hero {
        display: block !important;
        padding-top: 0 !important;
      }
    }
  </style>
</head>
